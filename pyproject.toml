[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rochespec"
version = "0.2.0"
description = "Roche-model metallicities for contact binaries from survey spectra"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Serat M. Saad" }]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "astropy"]

[project.optional-dependencies]
phoebe = ["phoebe>=2.5"]
spice = ["jax", "stellar-spice"]
plot = ["matplotlib"]
pipelines = ["pandas", "requests", "matplotlib", "astroquery", "dustmaps"]
test = ["pytest"]
all = ["phoebe>=2.5", "jax", "stellar-spice", "matplotlib", "pandas", "requests", "astroquery", "dustmaps", "pytest"]

[project.scripts]
rochespec = "rochespec.cli:main"

[project.urls]
Homepage = "https://github.com/seratsaad/rochespec"

[tool.setuptools.packages.find]
include = ["rochespec*"]

[tool.setuptools.package-data]
rochespec = ["data/*"]
